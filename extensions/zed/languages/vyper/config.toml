name = "Vyper"
grammar = "vyper"
path_suffixes = ["vy"]
line_comments = ["# "]
tab_size = 4
auto_indent_using_last_non_empty_line = true
increase_indent_pattern = "^[^#].*:\\s*(#.*)?$"
decrease_indent_patterns = [
  { pattern = "^\\s*elif\\b.*:\\s*(#.*)?", valid_after = ["if", "elif"] },
  { pattern = "^\\s*else\\b.*:\\s*(#.*)?", valid_after = ["if", "elif", "for"] },
]
