id = "serpent-vyper"
name = "Serpent - Vyper Language Support"
version = "0.1.0"
schema_version = 1
authors = ["Serpent Team"]
description = "Vyper language support for Zed — pre-compiled tree-sitter grammar + LSP"
repository = "https://github.com/Olyno/serpent"

[grammars.vyper]
repository = "https://github.com/Olyno/tree-sitter-vyper"
rev = "master"

[language_servers.vyper]
name = "Serpent LSP"
language = "Vyper"
# Auto-detect Flatpak, route through flatpak-spawn if sandboxed
command = "sh"
args = ["-c", "if command -v flatpak-spawn >/dev/null 2>&1; then exec flatpak-spawn --host serpent-lsp; else exec serpent-lsp; fi"]
